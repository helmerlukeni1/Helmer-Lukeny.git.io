<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Evento Dom</title>
    


          <style>
      button{
        font: normal 20pt Arial;
        background: green;
        color: white;
        width: 200px;
        height: 200px;
        line-height: 200px;
        text-align: center;
      }
    </style>
    </head>
    
    <body>
      <button id="area">
        Interaja
      </button>
      
    
    <script>
      var a= window.document.getElementById("area")
      a.addEventListener("Click" Clicar)
      a.addEventListener("onmouseup" Sair)
      
    </script>
    
        </body>
    </html>
